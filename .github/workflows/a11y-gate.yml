name: a11y-gate

on:
  pull_request:
    branches: [ "main" ]

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read HTML file
        id: html
        run: |
          html=$(python - <<'PY'
          import json
          with open("index.html","r",encoding="utf-8") as f:
            print(json.dumps(f.read()))
          PY
          )
          echo "HTML_JSON=$html" >> $GITHUB_OUTPUT

      - name: Call A11y Score API
        id: score
        run: |
          resp=$(curl -s -X POST "${A11Y_API_BASE}/score" \
            -H "Content-Type: application/json" \
            -d "{\"repo\":\"${GITHUB_REPOSITORY}\",\"commit_sha\":\"${GITHUB_SHA}\",\"html\":${{ steps.html.outputs.HTML_JSON }} }")
          echo "$resp"
          echo "RESP=$resp" >> $GITHUB_OUTPUT
        env:
          A11Y_API_BASE: https://912zbihl02.execute-api.sa-east-1.amazonaws.com/default

      - name: Enforce threshold
        run: |
          python - <<'PY'
          import json, os, sys
          resp=json.loads(os.environ["RESP"])
          if not resp.get("passed", False):
            print("A11Y gate FAILED:", resp)
            sys.exit(1)
          print("A11Y gate PASSED:", resp)
          PY
        env:
          RESP: ${{ steps.score.outputs.RESP }}
